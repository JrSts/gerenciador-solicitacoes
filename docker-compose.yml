version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sgs-postgres
    restart: always

    environment:
      POSTGRES_DB: sgs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/java/com/jrsts/sgs/scripts/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql

  backend:
    build:
      context: ./backend

    container_name: sgs-backend

    restart: always

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sgs
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    build:
      context: ./frontend

    container_name: sgs-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080

volumes:
  postgres_data:
